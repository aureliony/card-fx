[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "card-fx"
version = "1.0"
description = "Compare currency exchange rates and markups across Visa, Mastercard, and UnionPay"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "curl_cffi>=0.7.0",
    "numpy>=1.20.0",
    "tabulate>=0.9.0",
]

[project.scripts]
card-fx = "main:main"

[tool.setuptools]
py-modules = ["fx_api", "main"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
